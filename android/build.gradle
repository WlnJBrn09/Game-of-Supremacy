plugins { id 'com.android.application' }
configurations { natives }
android {
    namespace 'com.supremacy.android'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'com.supremacy.game'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.3.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    sourceSets.main { assets.srcDirs = ['../src/main/resources']; jniLibs.srcDirs = [layout.buildDirectory.dir('generated/natives')] }
    // Release signing comes from CI secrets; without them only the debug APK is built.
    def keystore = System.getenv('SUPREMACY_KEYSTORE')
    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('SUPREMACY_STORE_PASSWORD')
                keyAlias System.getenv('SUPREMACY_KEY_ALIAS')
                keyPassword System.getenv('SUPREMACY_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (keystore) signingConfig signingConfigs.release } }
}
dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    ['armeabi-v7a','arm64-v8a','x86_64'].each { arch ->
        natives "com.badlogicgames.gdx:gdx-platform:1.13.1:natives-${arch}"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:1.13.1:natives-${arch}"
    }
}
tasks.register('extractNatives') {
    inputs.files configurations.natives
    outputs.dir layout.buildDirectory.dir('generated/natives')
    doLast {
        configurations.natives.files.each { jar ->
            def arch = ['armeabi-v7a','arm64-v8a','x86_64'].find { jar.name.contains("natives-${it}") }
            copy { from zipTree(jar); include '*.so'; into layout.buildDirectory.dir("generated/natives/${arch}") }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'extractNatives' }
