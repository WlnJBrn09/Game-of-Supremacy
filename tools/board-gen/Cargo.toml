[package]
name = "board-gen"
version = "0.2.0"
edition = "2021"
description = "Rebuilds assets/board.json and docs/TERRITORIES.md from pinned Natural Earth sources"
publish = false

[dependencies]
# GEOS is the geometry engine Shapely wraps; the static build compiles the pinned
# GEOS 3.14.1 sources (the version Shapely 2.2.0 ships) so the board reproduces byte-for-byte without system libraries.
geos = { version = "=11.1.1", features = ["static", "v3_14_0"] }
geos-sys = "=2.0.9"
geos-src = "=0.2.4"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "3", features = ["platform-verifier"] }
